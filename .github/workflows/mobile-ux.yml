name: Mobile UX Smoke

on:
  pull_request:
    paths:
      - "src/household_supply/web/**"
      - "tests/mobile_ux_smoke.py"
      - ".github/workflows/mobile-ux.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install app and browser harness
        run: python -m pip install -e ".[web]" selenium
      - name: Run Chrome mobile smoke (390x844)
        run: python tests/mobile_ux_smoke.py
      - name: Upload mobile screenshots and server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ux-390px
          path: artifacts/mobile-ux/
          if-no-files-found: ignore
